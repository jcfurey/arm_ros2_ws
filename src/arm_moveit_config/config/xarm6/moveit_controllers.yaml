moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_simple_controller_manager:
  controller_names: [arm_controller, gripper_controller]
  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
  gripper_controller:
    type: ParallelGripperCommand
    action_ns: gripper_cmd
    default: true
    joints: [drive_joint]
trajectory_execution:
  allowed_execution_duration_scaling: 2.0
  allowed_goal_duration_margin: 1.0
  allowed_start_tolerance: 0.01
  # A gripper squeezing a part at its force limit dithers by ~0.02 rad, so the
  # arm's start check would reject the release. The gripper command is a
  # single target; where it starts from does not matter.
  allowed_start_tolerance_joints:
    drive_joint: 0.1
