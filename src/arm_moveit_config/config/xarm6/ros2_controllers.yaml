controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController
arm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.05
gripper_controller:
  ros__parameters:
    joint: drive_joint
    state_interfaces: [position, velocity]
    goal_tolerance: 0.01
    # Closing on a part stops short of the commanded position; report that
    # stall as success so a grasp completes. Contact keeps the drive jittering
    # at a few mrad/s, so "stopped" is below 0.01 rad/s.
    allow_stalling: true
    stall_velocity_threshold: 0.01
    stall_timeout: 0.3
