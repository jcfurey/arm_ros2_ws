name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests and packaged panel
    runs-on: ubuntu-24.04
    container: ros:lyrical-ros-base-resolute
    steps:
      - name: Install test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git python3-pytest \
            ros-lyrical-moveit-msgs ros-lyrical-octomap-msgs

      - uses: actions/checkout@v4

      # Scene, pick and motion-panel logic, the bootstrap script, and that the
      # checked-in .foxe matches lichtblick/moveit-panel. No workspace build.
      - name: Run scripts/test.sh
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          bash scripts/test.sh

  panel:
    name: MoveIt panel (Node)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lichtblick/moveit-panel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - run: npm test

  stack:
    name: Build and smoke-test the stack
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # compose.yaml defaults to arm64 and one compile job, for a 16 GB Mac.
      DOCKER_PLATFORM: linux/amd64
      MAKEFLAGS: -j4 -l4
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the image
        run: docker compose build dev

      # Each smoke test starts its own headless stack, checks it and stops it.
      # They share the build volumes, so they run one after another; the first
      # builds the workspace. `docker compose run` is called directly because
      # make would replace MAKEFLAGS with its own jobserver flags.
      - name: Mock smoke test (builds the workspace)
        run: >-
          docker compose run --rm --no-deps -e ROS_DOMAIN_ID=44 dev
          bash scripts/smoke-test.sh mock

      - name: Gazebo smoke test
        run: >-
          docker compose run --rm --no-deps -e ROS_DOMAIN_ID=43 dev
          bash scripts/smoke-test.sh gazebo

      # MoveIt only logs an error when its occupancy map updater is missing,
      # so this run requires the map to hold an obstacle MoveIt does not know.
      - name: Gazebo smoke test with the occupancy map
        env:
          ENABLE_PERCEPTION: 'true'
        run: >-
          docker compose run --rm --no-deps -e ROS_DOMAIN_ID=46 dev
          bash scripts/smoke-test.sh gazebo
